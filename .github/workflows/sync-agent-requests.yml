name: Sync agent feature requests

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-agent-feature-requests
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror new requests into GitHub triage
        uses: actions/github-script@v8
        with:
          script: |
            const response = await fetch('https://agents.dooza.ai/api/entries?kind=feature_request&limit=100');
            if (!response.ok) throw new Error(`Common returned ${response.status}`);
            const payload = await response.json();
            const requests = Array.isArray(payload.entries) ? payload.entries : [];
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'agent-feature-request',
              per_page: 100,
            });
            for (const request of requests) {
              const marker = `<!-- common-entry:${request.id} -->`;
              if (existing.some((issue) => !issue.pull_request && (issue.body || '').includes(marker))) continue;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Agent request] ${String(request.title).slice(0, 180)}`,
                labels: ['agent-feature-request', 'triage'],
                body: `${marker}\n\n**Requesting agent:** \`${request.agent}\`\n\n${request.body}\n\n**Tags:** ${(request.tags || []).map((tag) => `\`${tag}\``).join(', ') || 'none'}\n\n[View the public queue](https://agents.dooza.ai/requests)`,
              });
            }
