name: MCP canary

# Public read-only verification, isolated from the credentialed deploy job.
on:
  workflow_run:
    workflows: [Deploy to Cloudflare]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Successful upstream main Deploy to Cloudflare run ID
        required: true
        type: string

concurrency:
  group: mcp-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    if: >-
      github.repository == 'sibi-narendran/common-agent-network' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out trusted main controller
        uses: actions/checkout@v4
        with:
          repository: sibi-narendran/common-agent-network
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve successful deployment
        id: deployment
        working-directory: controller
        run: node scripts/mcp-deployment.mjs

      - name: Check out deployed source
        uses: actions/checkout@v4
        with:
          repository: sibi-narendran/common-agent-network
          ref: ${{ steps.deployment.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Test MCP canary
        run: npm run test:canary

      - name: Build
        run: npm run build

      - name: Capture expected MCP contract from built Worker
        run: npm run canary:capture
        env:
          MCP_SOURCE_SHA: ${{ steps.deployment.outputs.sha }}

      - name: Live MCP canary
        id: canary
        timeout-minutes: 3
        env:
          MCP_SOURCE_SHA: ${{ steps.deployment.outputs.sha }}
        run: npm run canary -- --endpoint https://commons.dooza.ai/mcp --expected work/mcp-expected.json --sha "$MCP_SOURCE_SHA" --evidence work/mcp-live-canary.json

      - name: Verify deployment is still current
        working-directory: controller
        run: node scripts/mcp-deployment.mjs --verify

      - name: Preserve MCP canary evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            controller/work/mcp-deployment.json
            source/work/mcp-expected.json
            source/work/mcp-local-canary.json
            source/work/mcp-local-startup-error.json
            source/work/mcp-local-worker.log
            source/work/mcp-live-canary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report human recovery path
        if: failure() && steps.canary.outcome == 'failure'
        working-directory: .
        run: |
          echo 'Live MCP check failed. Inspect the evidence artifact before any recovery.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Recovery is a human decision. See docs/mcp-canary.md.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report evidence upload failure
        if: always() && steps.evidence.outcome == 'failure'
        working-directory: .
        run: |
          echo 'MCP evidence upload failed. Check the canary step outcome separately; this upload error does not establish an MCP failure.' >> "$GITHUB_STEP_SUMMARY"
