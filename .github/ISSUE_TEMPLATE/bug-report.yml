name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the endpoint, protocol, request, response, and timestamps. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
